<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser UI calls an Express server which dispatches to four route modules, business logic modules, configuration, and a JSON database. The order placement path is numbered one through nine.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52606d"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563a9"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
      .title { font-size: 25px; font-weight: 700; }
      .sub { font-size: 14px; fill: #52606d; }
      .group { font-size: 16px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .route { fill: #edf5ff; stroke: #5b92c8; stroke-width: 1.5; rx: 7; }
      .module { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.25; rx: 6; }
      .ticket { fill: #fff0e5; stroke: #e8792b; stroke-width: 2; rx: 6; }
      .config { fill: #f4efff; stroke: #8b6cc7; stroke-width: 1.5; rx: 7; }
      .data { fill: #ebf9f0; stroke: #3c9364; stroke-width: 1.5; rx: 7; }
      .label { font-size: 14px; font-weight: 700; }
      .detail { font-size: 12px; fill: #52606d; }
      .note { font-size: 12px; fill: #344154; }
      .line { fill: none; stroke: #52606d; stroke-width: 1.4; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2563a9; stroke-width: 2.2; marker-end: url(#flowArrow); }
      .n { fill: #2563a9; }
      .ntext { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="40" y="40" class="title">ShopLedger — architecture and order placement</text>
  <text x="40" y="63" class="sub">Node/Express POS, Khata ledger, GST invoicing • numbered arrows trace POST /api/orders</text>

  <!-- Browser and server -->
  <rect x="40" y="105" width="190" height="108" class="box"/>
  <text x="58" y="132" class="group">Browser UI</text>
  <text x="58" y="156" class="label">public/</text>
  <text x="58" y="177" class="detail">index.html • css/style.css</text>
  <text x="58" y="195" class="detail">js/app.js</text>

  <rect x="295" y="105" width="208" height="108" class="box"/>
  <text x="314" y="132" class="group">Express application</text>
  <text x="314" y="158" class="label">server.js</text>
  <text x="314" y="179" class="detail">mounts /api routers</text>
  <text x="314" y="197" class="detail">GET /orders/:id/invoice</text>

  <path d="M230 159 H294" class="flow"/>
  <circle cx="262" cy="145" r="11" class="n"/><text x="262" y="145" class="ntext">1</text>
  <text x="237" y="184" class="note">POST /api/orders</text>

  <!-- Routes -->
  <text x="560" y="98" class="group">routes/</text>
  <rect x="550" y="110" width="180" height="70" class="route"/>
  <text x="566" y="137" class="label">products.js</text><text x="566" y="158" class="detail">GET products, coupons</text>
  <rect x="750" y="110" width="190" height="70" class="route"/>
  <text x="766" y="137" class="label">orders.js</text><text x="766" y="158" class="detail">GET/POST orders, cancel</text>
  <rect x="960" y="110" width="190" height="70" class="route"/>
  <text x="976" y="137" class="label">customers.js</text><text x="976" y="158" class="detail">GET customers, settle</text>
  <rect x="650" y="195" width="190" height="70" class="route"/>
  <text x="666" y="222" class="label">reports.js</text><text x="666" y="243" class="detail">dashboard, GST, preview</text>
  <path d="M503 159 H749" class="flow"/>
  <circle cx="617" cy="145" r="11" class="n"/><text x="617" y="145" class="ntext">2</text>
  <text x="570" y="188" class="note">dispatches to order route</text>

  <!-- Order placement mini flow -->
  <rect x="40" y="250" width="460" height="115" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" rx="8"/>
  <text x="58" y="277" class="group">Order route: routes/orders.js → POST /orders</text>
  <text x="58" y="301" class="note">3 Read DB • 4 resolve products/validate stock • 5 validate coupon</text>
  <text x="58" y="324" class="note">6 compute totals • 7 charge Khata (when applicable) • 8 reserve stock/add order</text>
  <text x="58" y="347" class="note">9 append audit and write DB</text>

  <!-- Lib modules -->
  <text x="550" y="305" class="group">lib/</text>
  <rect x="550" y="320" width="150" height="55" class="module"/>
  <text x="563" y="344" class="label">store.js</text><text x="563" y="363" class="detail">read, write, appendAudit</text>
  <rect x="715" y="320" width="150" height="55" class="module"/>
  <text x="728" y="344" class="label">inventory.js</text><text x="728" y="363" class="detail">find, check, reserve</text>
  <rect x="880" y="320" width="150" height="55" class="module"/>
  <text x="893" y="344" class="label">orders.js</text><text x="893" y="363" class="detail">add, get, cancel, list</text>
  <rect x="1045" y="320" width="115" height="55" class="module"/>
  <text x="1058" y="344" class="label">ledger.js</text><text x="1058" y="363" class="detail">Khata</text>

  <rect x="550" y="390" width="150" height="55" class="module"/>
  <text x="563" y="414" class="label">pricing.js</text><text x="563" y="433" class="detail">subtotal, computeTotals</text>
  <rect x="715" y="390" width="150" height="55" class="module"/>
  <text x="728" y="414" class="label">coupons.js</text><text x="728" y="433" class="detail">validate, discount</text>
  <rect x="880" y="390" width="150" height="55" class="ticket"/>
  <text x="893" y="414" class="label">invoice.js</text><text x="893" y="433" class="detail">compute, render</text>
  <rect x="1045" y="390" width="115" height="55" class="ticket"/>
  <text x="1058" y="414" class="label">tax.js</text><text x="1058" y="433" class="detail">GST rate</text>

  <rect x="550" y="460" width="150" height="55" class="module"/>
  <text x="563" y="484" class="label">reports.js</text><text x="563" y="503" class="detail">dashboard, GST recon</text>
  <rect x="715" y="460" width="150" height="55" class="module"/>
  <text x="728" y="484" class="label">dates.js</text><text x="728" y="503" class="detail">today, fiscal year</text>

  <!-- Config and data -->
  <rect x="62" y="440" width="210" height="78" class="config"/>
  <text x="78" y="469" class="group">config.js</text>
  <text x="78" y="491" class="detail">shop • tax slabs • coupons</text>
  <text x="78" y="509" class="detail">inventory • port • admin key</text>
  <rect x="62" y="580" width="210" height="90" class="data"/>
  <text x="78" y="610" class="group">data/db.json</text>
  <text x="78" y="632" class="detail">products • orders • customers</text>
  <text x="78" y="650" class="detail">settlements • auditLog • counters</text>

  <!-- Dependencies and data lines -->
  <path d="M750 180 V285 H625 V319" class="line"/>
  <path d="M835 180 V285 H790 V319" class="flow"/>
  <circle cx="808" cy="285" r="11" class="n"/><text x="808" y="285" class="ntext">3</text>
  <text x="842" y="283" class="note">read order state</text>
  <path d="M625 375 V390" class="flow"/>
  <circle cx="607" cy="383" r="11" class="n"/><text x="607" y="383" class="ntext">6</text>
  <path d="M790 375 V390" class="line"/>
  <path d="M625 445 V500 H340 V479 H272" class="line"/>
  <path d="M790 445 V500 H340 V479 H272" class="line"/>
  <path d="M1099 375 V460 H1030" class="line"/>
  <path d="M700 347 H714" class="flow"/>
  <circle cx="707" cy="333" r="11" class="n"/><text x="707" y="333" class="ntext">4</text>
  <path d="M865 347 H879" class="flow"/>
  <circle cx="872" cy="333" r="11" class="n"/><text x="872" y="333" class="ntext">8</text>
  <path d="M865 417 H879" class="flow"/>
  <circle cx="872" cy="403" r="11" class="n"/><text x="872" y="403" class="ntext">5</text>
  <path d="M1030 347 H1044" class="flow"/>
  <circle cx="1037" cy="333" r="11" class="n"/><text x="1037" y="333" class="ntext">7</text>
  <path d="M550 347 H272" class="line"/>
  <path d="M550 347 H272" opacity="0"/>
  <path d="M550 347 H500 V625 H273" class="flow"/>
  <circle cx="486" cy="625" r="11" class="n"/><text x="486" y="625" class="ntext">9</text>
  <text x="365" y="648" class="note">write full JSON database</text>
  <path d="M272 479 H550" class="line"/>
  <text x="360" y="472" class="note">tax slabs &amp; coupon rules</text>
  <path d="M272 625 H499" class="line"/>

  <!-- Invoice path -->
  <path d="M399 213 V705 H879 V445" class="line"/>
  <text x="515" y="725" class="note">GET /orders/:id/invoice → invoice.render()</text>
  <path d="M955 445 H1044" class="line"/>
  <path d="M955 445 V540 H625 V445" class="line"/>

  <!-- Legend -->
  <rect x="880" y="580" width="280" height="118" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="898" y="606" class="group">Legend</text>
  <rect x="898" y="621" width="18" height="14" class="route"/><text x="926" y="633" class="note">HTTP route module</text>
  <rect x="898" y="646" width="18" height="14" class="module"/><text x="926" y="658" class="note">Business/support module</text>
  <rect x="898" y="671" width="18" height="14" class="ticket"/><text x="926" y="683" class="note">Ticket focus: invoice.js, tax.js</text>
</svg>
